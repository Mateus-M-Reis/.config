shell=fish
title=foot
font=JetBrains Mono Nerd Font:size=12
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no
# Rewritten by hypr/utils/wallpaper-daynight.sh so new windows start in the
# right theme. Running windows are switched with SIGUSR1/SIGUSR2 instead.
include=~/.config/foot/theme-default.ini

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

# Night: black background, light text.
[colors-dark]
background=000000
foreground=e6edf3
regular0=484f58
regular1=ff7b72
regular2=3fb950
regular3=d29922
regular4=58a6ff
regular5=bc8cff
regular6=39c5cf
regular7=b1bac4
bright0=6e7681
bright1=ffa198
bright2=56d364
bright3=e3b341
bright4=79c0ff
bright5=d2a8ff
bright6=56d4dd
bright7=f0f6fc
selection-foreground=ffffff
selection-background=1f6feb
alpha=0.78
alpha-mode=matching
blur=yes

# Day: white background, dark text.
[colors-light]
background=ffffff
foreground=1f2328
regular0=24292f
regular1=cf222e
regular2=116329
regular3=4d2d00
regular4=0969da
regular5=8250df
regular6=1b7c83
regular7=6e7781
bright0=57606a
bright1=a40e2e
bright2=1a7f37
bright3=9a6700
bright4=218bff
bright5=a475f9
bright6=3192aa
bright7=8c959f
selection-foreground=ffffff
selection-background=0969da
alpha=0.95
alpha-mode=matching
blur=yes

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f
color-theme-toggle=Control+Shift+d

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
