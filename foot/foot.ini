shell=fish
title=foot
font=JetBrains Mono Nerd Font:size=12
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no
# Rewritten by hypr/utils/wallpaper-daynight.sh so new windows start in the
# right theme. Running windows are switched with SIGUSR1/SIGUSR2 instead.
include=~/.config/foot/theme-default.ini

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

# Matte black. Both themes hold the same palette so the day/night toggle in
# wallpaper-daynight.sh cannot bring colour back, and alpha=1 keeps it opaque.
[colors-dark]
background=050505
foreground=e6e6e6
regular0=161616
regular1=8e8e8e
regular2=a6a6a6
regular3=bebebe
regular4=7c7c7c
regular5=9a9a9a
regular6=b2b2b2
regular7=c8c8c8
bright0=4c4c4c
bright1=a8a8a8
bright2=bcbcbc
bright3=d0d0d0
bright4=949494
bright5=a2a2a2
bright6=b6b6b6
bright7=dcdcdc
selection-foreground=050505
selection-background=e0e0e0
alpha=1

# Intentionally identical to colors-dark on this branch.
[colors-light]
background=050505
foreground=e6e6e6
regular0=161616
regular1=8e8e8e
regular2=a6a6a6
regular3=bebebe
regular4=7c7c7c
regular5=9a9a9a
regular6=b2b2b2
regular7=c8c8c8
bright0=4c4c4c
bright1=a8a8a8
bright2=bcbcbc
bright3=d0d0d0
bright4=949494
bright5=a2a2a2
bright6=b6b6b6
bright7=dcdcdc
selection-foreground=050505
selection-background=e0e0e0
alpha=1

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f
color-theme-toggle=Control+Shift+d

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
